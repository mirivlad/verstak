name: apply-overview-contract-fix

on:
  push:
    branches:
      - audit/overview-ux-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/overview-ux-1

      - name: Update Overview E2E contract
        run: python .github/scripts/fix_overview_ux_contract.py

      - name: Remove one-shot machinery and commit
        run: |
          rm .github/workflows/apply-overview-contract-fix.yml
          rm .github/scripts/fix_overview_ux_contract.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test: align Overview E2E with resume semantics"
          git push origin HEAD:audit/overview-ux-1
