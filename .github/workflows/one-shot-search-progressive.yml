name: one-shot-search-progressive

on:
  push:
    branches:
      - audit/global-search-providers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/global-search-providers
          fetch-depth: 0
      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins
      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh
      - name: Apply Search and test-contract fixes
        run: |
          python3 .github/scripts/patch_global_search_progressive.py
          python3 .github/scripts/patch_real_files_mock.py
      - name: Build and source-contract checks
        run: |
          npm run build --prefix frontend
          node frontend/tests/shell-source-contract-test.mjs
          git diff --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the two Search regressions
        working-directory: frontend
        run: |
          npx playwright test --config playwright.config.js e2e/global-search-results.spec.js -g 'publishes a nested filename before delayed content reads finish'
          npx playwright test --config playwright.config.js e2e/ux-followup.spec.js -g 'global search folder results open the workspace Files context'
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/shell/GlobalSearch.svelte \
            frontend/src/lib/shell/WorkspaceHost.svelte \
            frontend/src/lib/test/wails-mock.js \
            frontend/e2e/ux-followup.spec.js \
            frontend/tests/shell-source-contract-test.mjs
          git diff --cached --check
          git commit -m 'fix: preserve fast and deep Search navigation'
          git push origin HEAD:audit/global-search-providers
