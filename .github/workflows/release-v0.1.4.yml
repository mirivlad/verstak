name: release-v0.1.4

on:
  push:
    branches: [main]
    paths:
      - 'release-notes/v0.1.4.md'
      - 'scripts/publish-github-release.sh'
      - '.github/workflows/release-v0.1.4.yml'

permissions:
  contents: read

concurrency:
  group: release-v0.1.4
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: v0.1.4
      OFFICIAL_PLUGINS_REF: f49878284e6a1fe15cf95f4040d1c4f6a50ab058

    steps:
      - name: Require main
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Release must run from main, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Check out desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: ${{ env.OFFICIAL_PLUGINS_REF }}
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-bin imagemagick \
            gcc-mingw-w64-x86-64 file curl zip

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Require release notes
        run: test -s "release-notes/$VERSION.md"

      - name: Build Linux and Windows release assets
        run: bash scripts/release.sh "$VERSION"

      - name: Smoke-test packaged release
        run: bash scripts/release-smoke.sh "$VERSION"

      - name: Verify expected assets
        run: |
          test -s "release/verstak_${VERSION#v}_amd64.deb"
          test -s "release/verstak-linux-x86_64-$VERSION.AppImage"
          test -s "release/verstak-windows-amd64-$VERSION.zip"
          test -s release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: verstak-v0.1.4
          path: |
            release/verstak_0.1.4_amd64.deb
            release/verstak-linux-x86_64-v0.1.4.AppImage
            release/verstak-windows-amd64-v0.1.4.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: v0.1.4
      GH_TOKEN: ${{ github.token }}
      VERSTAK_SKIP_RELEASE_BUILD: '1'

    steps:
      - name: Check out verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: verstak-v0.1.4
          path: release

      - name: Recheck downloaded assets
        run: |
          test -s "release/verstak_${VERSION#v}_amd64.deb"
          test -s "release/verstak-linux-x86_64-$VERSION.AppImage"
          test -s "release/verstak-windows-amd64-$VERSION.zip"
          test -s release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)

      - name: Publish GitHub Release
        run: bash scripts/publish-github-release.sh "$VERSION"
