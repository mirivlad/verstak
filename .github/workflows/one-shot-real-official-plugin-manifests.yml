name: one-shot-real-official-plugin-manifests

on:
  push:
    branches:
      - audit/real-official-plugin-manifests

permissions:
  contents: write

concurrency:
  group: one-shot-real-official-plugin-manifests
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/real-official-plugin-manifests

      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh

      - name: Apply real official manifest migration
        run: python3 .github/scripts/patch_real_official_plugin_manifests.py

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run source contract
        run: node frontend/tests/shell-source-contract-test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run full E2E against real manifests
        run: npm run test:e2e
        working-directory: frontend

      - name: Commit manifest fixture migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/test/wails-mock.js frontend/tests/shell-source-contract-test.mjs
          git diff --cached --check
          git commit -m "test: use official plugin manifests in E2E"
          git push origin HEAD:audit/real-official-plugin-manifests
