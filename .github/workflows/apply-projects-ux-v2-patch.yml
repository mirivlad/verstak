name: apply-projects-ux-v2-patch

on:
  push:
    branches:
      - projects-ux-v2
    paths:
      - '.github/workflows/apply-projects-ux-v2-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projects-ux-v2
          fetch-depth: 0

      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.github/patches/projects-ux-v2.patch
          EXPECTED=de9e20173d6bf87527005bc0a6010e0b866bf41cdacdc3d694b530a9a693fa11
          ACTUAL="$(sha256sum "$PATCH" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          test "$(git rev-parse HEAD~1)" = "206eb6fb28c515ad9ca9fb302e67e3071a758492"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/plugin-api-bridge.spec.js \
                  frontend/src/lib/plugin-host/PluginBundleHost.svelte \
                  frontend/src/lib/plugin-host/VerstakPluginAPI.js
          git commit -m "plugin-api: expose Deal tree through core API"
          git push origin HEAD:projects-ux-v2
