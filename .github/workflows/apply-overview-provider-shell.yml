name: apply-overview-provider-shell

on:
  push:
    branches: [audit/overview-provider-shell]
    paths:
      - '.github/scripts/apply_overview_provider_shell.py'
      - '.github/workflows/apply-overview-provider-shell.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/overview-provider-shell
          fetch-depth: 0
          path: work/verstak
      - uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: work/verstak-official-plugins
      - uses: actions/setup-go@v5
        with:
          go-version-file: work/verstak/go.mod
          cache-dependency-path: work/verstak/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: work/verstak/frontend/package-lock.json
      - name: Correct one-shot API flattening anchors
        working-directory: work/verstak
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_overview_provider_shell.py')
          s = p.read_text()
          start = s.index("s = s.replace('\\tworklogProviders := make([]FlatWorklogProvider")
          end = s.index('# Return field near WorklogProviders.', start)
          lines = [
              "s = s.replace('\\tworklogProviders := make([]FlatWorklogProvider, len(regWorklogProviders))\\n', '\\tworklogProviders := make([]FlatWorklogProvider, len(regWorklogProviders))\\n\\toverviewProviders := make([]FlatOverviewProvider, len(regOverviewProviders))\\n', 1)",
              "worklog_loop = '\\tfor i, v := range regWorklogProviders {\\n\\t\\tworklogProviders[i] = FlatWorklogProvider{PluginID: v.PluginID, ID: v.Item.ID, Label: v.Item.Label, Handler: v.Item.Handler}\\n\\t}\\n'",
              "assert worklog_loop in s, 'worklog flatten loop not found'",
              "overview_loop = '\\tfor i, v := range regOverviewProviders {\\n\\t\\toverviewProviders[i] = FlatOverviewProvider{PluginID: v.PluginID, ID: v.Item.ID, Label: v.Item.Label, Handler: v.Item.Handler}\\n\\t}\\n'",
              "s = s.replace(worklog_loop, worklog_loop + overview_loop, 1)",
              "",
          ]
          s = s[:start] + '\n'.join(lines) + s[end:]
          start = s.index('# Return field near WorklogProviders.')
          end = s.index('p.write_text(s)', start)
          return_lines = [
              "old_return = 'WorklogProviders: worklogProviders, SettingsPanels:'",
              "assert old_return in s, 'ContributionSummary return WorklogProviders not found'",
              "s = s.replace(old_return, 'WorklogProviders: worklogProviders, OverviewProviders: overviewProviders, SettingsPanels:', 1)",
              "",
          ]
          p.write_text(s[:start] + '\n'.join(return_lines) + s[end:])
          PY
      - name: Correct WorkspaceHost patch structurally
        working-directory: work/verstak
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          p = Path('.github/scripts/apply_overview_provider_shell.py')
          s = p.read_text()
          start = s.index('# WorkspaceHost: scope providers')
          end = s.index('# Generic TodaySurface script.', start)
          section = dedent(r'''
          # WorkspaceHost: scope providers to the current Deal and navigate by exact id.
          # ---------------------------------------------------------------------------
          p = Path('frontend/src/lib/shell/WorkspaceHost.svelte')
          s = p.read_text()
          s = s.replace('  let workspaceTools = [];\n', '  let workspaceTools = [];\n  let overviewProviders = [];\n', 1)
          s = s.replace('requestedToolKind', 'requestedWorkspaceItemId')
          s = s.replace('findWorkspaceTool', 'findWorkspaceItem')
          s = s.replace('requestWorkspaceTool', 'requestWorkspaceItem')

          tools_line = "  $: workspaceTools = sortWorkspaceTools(filterWorkspaceTools(discoveredWorkspaceTools, workspaceMetadata));\n"
          assert tools_line in s
          s = s.replace(tools_line, tools_line + "  $: workspacePluginIds = new Set(workspaceTools.map(tool => tool?.pluginId).filter(Boolean));\n  $: overviewProviders = (contributions.overviewProviders || []).filter(provider => workspacePluginIds.has(provider?.pluginId));\n", 1)

          find_pattern = re.compile(r"  function findWorkspaceItem\(kind\) \{.*?\n  \}\n\n  function requestWorkspaceItem", re.S)
          find_replacement = '''  function findWorkspaceItem(workspaceItemId) {
            const id = String(workspaceItemId || '').trim();
            if (!id) return null;
            return workspaceTools.find(tool => tool?.id === id) || null;
          }

          function requestWorkspaceItem'''
          s, count = find_pattern.subn(find_replacement, s, count=1)
          assert count == 1, 'findWorkspaceItem block not found'

          request_pattern = re.compile(r"  function requestWorkspaceItem\(kind, toolRequest = null\) \{.*?\n  \}\n\n  function openWorkspaceTool", re.S)
          request_replacement = '''  function requestWorkspaceItem(workspaceItemId, toolRequest = null) {
            requestedWorkspaceItemId = String(workspaceItemId || '').trim();
            requestedToolRequest = toolRequest;
            const match = findWorkspaceItem(requestedWorkspaceItemId);
            if (match) {
              requestedWorkspaceItemId = '';
              requestedToolRequest = null;
              selectTool(match, toolRequest);
            }
          }

          function openWorkspaceTool'''
          s, count = request_pattern.subn(request_replacement, s, count=1)
          assert count == 1, 'requestWorkspaceItem block not found'

          s = s.replace('event?.detail?.kind', 'event?.detail?.workspaceItemId')
          surface_anchor = '              availableTools={displayedTools}\n              on:openTool={openWorkspaceTool}'
          assert surface_anchor in s
          s = s.replace(surface_anchor, '              availableTools={displayedTools}\n              {overviewProviders}\n              on:openTool={openWorkspaceTool}', 1)
          p.write_text(s)

          # ---------------------------------------------------------------------------
          ''')
          p.write_text(s[:start] + section + s[end:])
          PY
      - name: Apply provider shell patch
        working-directory: work/verstak
        run: |
          python3 .github/scripts/apply_overview_provider_shell.py
          gofmt -w internal/core/plugin/plugin.go internal/core/contribution/registry.go internal/core/contribution/registry_test.go internal/api/app.go
      - name: Install frontend dependencies
        working-directory: work/verstak/frontend
        run: npm ci --no-audit --no-fund
      - name: Build current official plugins
        working-directory: work/verstak
        run: bash ../verstak-official-plugins/scripts/build.sh
      - name: Build frontend
        working-directory: work/verstak/frontend
        run: npm run build
      - name: Architecture source contract
        working-directory: work/verstak
        run: node frontend/tests/shell-source-contract-test.mjs
      - name: Focused Go tests
        working-directory: work/verstak
        run: go test ./internal/core/plugin ./internal/core/contribution ./internal/api
      - name: Remove one-shot machinery and commit
        working-directory: work/verstak
        run: |
          rm -f .github/scripts/apply_overview_provider_shell.py .github/workflows/apply-overview-provider-shell.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: consume Overview provider contributions'
          git push origin HEAD:audit/overview-provider-shell
