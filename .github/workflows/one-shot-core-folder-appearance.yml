name: one-shot-core-folder-appearance

on:
  push:
    branches:
      - audit/core-folder-appearance

permissions:
  contents: write

concurrency:
  group: one-shot-core-folder-appearance
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core-folder-appearance

      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh

      - name: Apply frontend/core API alignment
        run: python3 .github/scripts/patch_core_folder_appearance_frontend.py

      - name: Format Go changes
        run: gofmt -w internal/api/app.go internal/core/workspacetree/appearance.go internal/core/workspacetree/appearance_test.go internal/core/workspacetree/service.go

      - name: Run focused Go tests
        run: go test ./internal/core/workspacetree ./internal/api

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run source contract
        run: node frontend/tests/shell-source-contract-test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run folder appearance E2E
        run: npx playwright test e2e/folder-appearance-core.spec.js --config playwright.config.js
        working-directory: frontend

      - name: Run full E2E
        run: npm run test:e2e
        working-directory: frontend

      - name: Commit permanent migration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/api/app.go \
            internal/core/workspacetree/appearance.go \
            internal/core/workspacetree/appearance_test.go \
            internal/core/workspacetree/service.go \
            frontend/src/lib/shell/WorkspaceTree.svelte \
            frontend/src/lib/test/wails-mock.js \
            frontend/tests/shell-source-contract-test.mjs \
            frontend/e2e/folder-appearance-core.spec.js
          git diff --cached --check
          git commit -m "refactor: move folder appearance fully into core"
          git push origin HEAD:audit/core-folder-appearance
