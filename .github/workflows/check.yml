name: check

on:
  push:
    branches: ['feat/projects-template']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projects-template-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-projects-e2e-catalog:
    if: github.ref == 'refs/heads/feat/projects-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/projects-template
      - name: Apply generated E2E catalog patch once
        run: |
          if git apply --reverse --check .github/projects-e2e-fix.patch 2>/dev/null; then
            echo "Patch already applied."
            exit 0
          fi
          git apply --check .github/projects-e2e-fix.patch
          git apply --index .github/projects-e2e-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: register Projects in E2E plugin catalog"
          git push origin HEAD:feat/projects-template
