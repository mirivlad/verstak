name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # The sibling official plugins are pinned to `main` below, not to a commit, so
  # this repository's own checks describe a moving dependency. Nothing here runs
  # when that dependency changes. The plugins repository now runs the desktop
  # icon contract on its own pull requests, which catches the known drift at the
  # source; this nightly run is the backstop for the drift nobody predicted.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contract tests intentionally verify the real bundled manifests and
      # source-level cross-repository contracts. A clean desktop checkout does
      # not contain those plugins, so make the sibling dependency explicit.
      - name: Check out the official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      # sdk-surface-test compares the plugin API the host provides with the
      # one the SDK declares, so the SDK sources must sit beside desktop too.
      - name: Check out the plugin SDK
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-sdk
          ref: main
          path: verstak-sdk

      - name: Put the SDK beside desktop
        run: mv verstak-sdk ../verstak-sdk

      # Ubuntu 24.04 no longer ships webkit2gtk-4.0. scripts/build.sh already
      # picks the right Wails build tag from pkg-config, so installing 4.1 is
      # enough and no build tag has to be pinned here.
      # ImageMagick 6 delegates SVG rendering to rsvg-convert, provided by
      # librsvg2-bin, so both are required by scripts/test-brand-icons.sh.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-bin imagemagick

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh

      - name: Install current official plugins
        run: bash scripts/install-dev-plugins.sh

      # main.go embeds frontend/dist, which is not committed. Without this the
      # Go steps fail before running anything with "pattern frontend/dist: no
      # matching files found" -- which reads like a missing file rather than a
      # missing build step.
      - name: Build the frontend
        run: npm run build
        working-directory: frontend

      - name: Static checks
        run: bash scripts/check.sh

      - name: Go and contract tests
        run: bash scripts/test.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Wails mock loads the real official plugin bundles from the sibling
      # repository, which is what makes these tests exercise the actual plugins
      # instead of stand-ins. A production build no longer needs it; the e2e
      # build does, and should fail rather than quietly test nothing.
      - name: Check out the official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put the plugins where the mock expects them
        run: mv verstak-official-plugins ../verstak-official-plugins

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      # Some official plugins intentionally commit source but not generated
      # frontend/dist output. The Wails mock imports those built bundles, so a
      # clean E2E checkout must build the sibling repository first.
      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Playwright drives the Svelte shell against mocked Wails bindings, so it
      # needs no Go toolchain and runs as its own job.
      - run: npm run test:e2e
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: frontend/e2e-results/
          retention-days: 7

  # The Windows ZIP is cross-compiled on Linux and was never run on Windows by
  # CI. Path handling (the Files API safe-path policy, trash, sync paths) is
  # where the platforms differ, and it is covered by Go tests, so run them on a
  # real Windows runner. The root package embeds the built frontend and is left
  # out; everything under internal/ is plain Go.
  go-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out the official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Git tests compare checked-out bytes; the runner's global autocrlf
      # would turn LF into CRLF underneath them.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Go tests on Windows
        # The bundled-plugin test reads the official plugin sources directly;
        # no install step runs on this job.
        env:
          VERSTAK_RELEASE_PLUGIN_DIR: ${{ github.workspace }}/../verstak-official-plugins/plugins
        run: go test -count=1 ./internal/...
