name: one-shot-progressive-global-search

on:
  push:
    branches:
      - audit/global-search-providers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/global-search-providers
          fetch-depth: 0
      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins
      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply progressive Search patch
        run: python3 .github/scripts/patch_progressive_global_search.py
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh
      - name: Verify the two blocked Search flows
        run: |
          npm run build --prefix frontend
          node frontend/tests/shell-source-contract-test.mjs
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test e2e/global-search-results.spec.js --grep 'publishes a nested filename before delayed content reads finish'
          npx playwright test e2e/ux-followup.spec.js --grep 'global search folder results open the workspace Files context'
          cd ..
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/shell/GlobalSearch.svelte frontend/tests/shell-source-contract-test.mjs
          git diff --cached --check
          git commit -m 'fix: publish GlobalSearch provider results progressively'
          git push origin HEAD:audit/global-search-providers
