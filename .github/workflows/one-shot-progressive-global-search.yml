name: one-shot-progressive-global-search

on:
  push:
    branches:
      - audit/global-search-providers

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/global-search-providers
      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins
      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply Search changes and diagnostic trace
        run: |
          python3 .github/scripts/patch_progressive_global_search.py
          python3 .github/scripts/patch_folder_search_e2e.py
          python3 .github/scripts/patch_workspace_item_navigation.py
          python3 .github/scripts/diagnose_folder_tool_request.py
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh
      - name: Trace folder navigation
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test e2e/ux-followup.spec.js --grep 'global search folder results open the workspace Files context'
