name: one-shot-real-trash-frontend

on:
  push:
    branches:
      - audit/official-plugin-runtime-alignment

permissions:
  contents: write

concurrency:
  group: one-shot-real-trash-frontend
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/official-plugin-runtime-alignment

      - name: Check out current official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh

      - name: Apply real Trash frontend migration
        run: python3 .github/scripts/patch_real_trash_frontend.py

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run shell source contract
        run: node frontend/tests/shell-source-contract-test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Trash E2E
        run: npx playwright test e2e/trash-plugin.spec.js --config playwright.config.js
        working-directory: frontend

      - name: Run full E2E
        run: npm run test:e2e
        working-directory: frontend

      - name: Commit permanent Trash migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/test/wails-mock.js frontend/tests/shell-source-contract-test.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test: use real Trash frontend in E2E"
          git push origin HEAD:audit/official-plugin-runtime-alignment
