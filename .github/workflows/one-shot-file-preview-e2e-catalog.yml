name: one-shot-file-preview-e2e-catalog

on:
  push:
    branches:
      - audit/file-preview-e2e-catalog

permissions:
  contents: write

concurrency:
  group: one-shot-file-preview-e2e-catalog
  cancel-in-progress: true

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-preview-e2e-catalog

      - name: Check out current official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh

      - name: Apply File Preview catalog alignment
        run: python3 .github/scripts/patch_file_preview_e2e_catalog.py

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run source contract
        run: node frontend/tests/shell-source-contract-test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run File Preview E2E
        run: npx playwright test e2e/file-preview.spec.js --config playwright.config.js
        working-directory: frontend

      - name: Run full E2E
        run: npm run test:e2e
        working-directory: frontend

      - name: Commit permanent catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/lib/test/wails-mock.js \
            frontend/tests/shell-source-contract-test.mjs \
            frontend/e2e/file-preview.spec.js
          git diff --cached --check
          git commit -m "test: include shipped File Preview in E2E catalog"
          git push origin HEAD:audit/file-preview-e2e-catalog
