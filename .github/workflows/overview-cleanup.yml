name: overview-cleanup

on:
  push:
    branches:
      - audit/overview-cleanup

permissions:
  contents: write

concurrency:
  group: overview-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out current official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins

      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply cleanup
        run: python3 .github/scripts/overview_cleanup.py

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Architecture source contract
        run: node frontend/tests/shell-source-contract-test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Overview E2E
        run: npx playwright test e2e/ux-today.spec.js
        working-directory: frontend

      - name: Verify diff
        run: |
          git diff --check
          test ! -e frontend/src/lib/shell/TodaySurface.svelte
          test -e frontend/src/lib/shell/OverviewSurface.svelte
          ! git grep -n 'today-' -- frontend/src/lib/shell/OverviewSurface.svelte
          ! git grep -n 'TodaySurface' -- frontend/src frontend/tests
          git status --short

      - name: Remove one-shot machinery and commit
        run: |
          rm .github/scripts/overview_cleanup.py .github/workflows/overview-cleanup.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: finish Overview shell cleanup'
          git push origin HEAD:audit/overview-cleanup
