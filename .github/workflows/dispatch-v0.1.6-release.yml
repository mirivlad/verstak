name: dispatch-v0.1.6-release

on:
  push:
    branches:
      - hotfix/v0.1.6-release-dispatch

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified v0.1.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mirivlad/verstak/actions/workflows/release.yml/dispatches \
            -d '{"ref":"main","inputs":{"version":"v0.1.6","official_plugins_ref":"main","publish":"true"}}'
