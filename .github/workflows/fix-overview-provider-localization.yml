name: fix-overview-provider-localization

on:
  push:
    branches: [audit/overview-provider-shell]
    paths:
      - '.github/scripts/fix_overview_provider_localization.py'
      - '.github/workflows/fix-overview-provider-localization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/overview-provider-shell
          fetch-depth: 0
          path: work/verstak
      - uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: work/verstak-official-plugins
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: work/verstak/frontend/package-lock.json
      - name: Apply localization fix
        working-directory: work/verstak
        run: python3 .github/scripts/fix_overview_provider_localization.py
      - name: Install dependencies
        working-directory: work/verstak/frontend
        run: npm ci --no-audit --no-fund
      - name: Build current official plugins
        working-directory: work/verstak
        run: bash ../verstak-official-plugins/scripts/build.sh
      - name: Build frontend
        working-directory: work/verstak/frontend
        run: npm run build
      - name: Run focused visual audit
        working-directory: work/verstak/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.visual.config.js
      - name: Architecture source contract
        working-directory: work/verstak
        run: node frontend/tests/shell-source-contract-test.mjs
      - name: Remove one-shot machinery and commit
        working-directory: work/verstak
        run: |
          rm -f .github/scripts/fix_overview_provider_localization.py .github/workflows/fix-overview-provider-localization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: localize Overview provider signals'
          git push origin HEAD:audit/overview-provider-shell
