name: apply-overview-ux-1

on:
  push:
    branches:
      - audit/overview-ux-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/overview-ux-1

      - name: Apply exact Overview UX changes
        run: python .github/scripts/apply_overview_ux_1.py

      - name: Remove one-shot patch machinery and commit result
        run: |
          rm .github/workflows/apply-overview-ux-1.yml
          rm .github/scripts/apply_overview_ux_1.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: separate Overview resume and attention signals"
          git push origin HEAD:audit/overview-ux-1
