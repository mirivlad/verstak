name: one-shot-real-files-contract

on:
  push:
    branches:
      - audit/global-search-providers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/global-search-providers
          fetch-depth: 0
      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: verstak-official-plugins
      - name: Put official plugins beside desktop
        run: mv verstak-official-plugins ../verstak-official-plugins
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build current official plugins
        run: bash ../verstak-official-plugins/scripts/build.sh
      - name: Apply real Files contract alignment
        run: python3 .github/scripts/patch_real_files_contract.py
      - name: Build and source-contract checks
        run: |
          npm run build --prefix frontend
          node frontend/tests/shell-source-contract-test.mjs
          git diff --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run complete Files E2E spec
        working-directory: frontend
        run: npx playwright test --config playwright.config.js e2e/files-plugin.spec.js
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/test/wails-mock.js frontend/e2e/files-plugin.spec.js frontend/tests/shell-source-contract-test.mjs
          git diff --cached --check
          git commit -m 'test: align Files E2E with official contract'
          git push origin HEAD:audit/global-search-providers
