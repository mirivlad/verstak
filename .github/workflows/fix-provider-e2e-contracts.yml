name: fix-provider-e2e-contracts

on:
  push:
    branches: [audit/overview-provider-shell]
    paths:
      - '.github/scripts/fix_provider_e2e_contracts.py'
      - '.github/workflows/fix-provider-e2e-contracts.yml'

permissions:
  contents: write

concurrency:
  group: fix-provider-e2e-contracts
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out desktop
        uses: actions/checkout@v4
        with:
          ref: audit/overview-provider-shell
          fetch-depth: 0
          path: work/verstak

      - name: Check out current official plugins
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-official-plugins
          ref: main
          path: work/verstak-official-plugins

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: work/verstak/frontend/package-lock.json

      - name: Apply provider E2E fixes
        working-directory: work/verstak
        run: python3 .github/scripts/fix_provider_e2e_contracts.py

      - name: Install frontend dependencies
        working-directory: work/verstak/frontend
        run: npm ci --no-audit --no-fund

      - name: Build current official plugins
        working-directory: work/verstak
        run: bash ../verstak-official-plugins/scripts/build.sh

      - name: Build frontend
        working-directory: work/verstak/frontend
        run: npm run build

      - name: Architecture source contract
        working-directory: work/verstak
        run: node frontend/tests/shell-source-contract-test.mjs

      - name: Run focused E2E diagnostics
        working-directory: work/verstak/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test browser-inbox.spec.js ux-today.spec.js

      - name: Remove one-shot machinery and commit
        working-directory: work/verstak
        run: |
          rm -f .github/scripts/fix_provider_e2e_contracts.py .github/workflows/fix-provider-e2e-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align provider navigation E2E contracts'
          git push origin HEAD:audit/overview-provider-shell
